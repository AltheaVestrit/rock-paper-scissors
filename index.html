<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <div id="container">
        <button id="rock">Rock</button>
        <button id="paper">Paper</button>
        <button id="scissors">Scissors</button>
    </div>

    <div id="results">
        <h3>Scores:</h3>
        <p>Computer score - <span id="computer_score">0</span></p>
        <p>Your score - <span id="human_score">0</span></p>
        <h3>Latest update:</h3>
        <p id="updates"></p>
    </div>

    <script src="javascript.js"></script>
</body>
</html>
